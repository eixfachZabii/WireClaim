[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wireclaim"
version = "0.1.0"
description = "Scheduled ingestion and processing scaffold for EHL Claim to Fame cases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
wireclaim = "wireclaim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "wireclaim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

