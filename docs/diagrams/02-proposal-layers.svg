<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="718px" preserveAspectRatio="none" style="width:752px;height:718px;background:#FFFFFF;" version="1.1" viewBox="0 0 752 718" width="752px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="341.5234" x="201.7882" y="20.7803">WireClaim &#8212; how a Charge and a Limit are decided</text></g><!--cluster Snap--><g class="cluster" data-qualified-name="Snap" data-source-line="7" id="ent0001"><rect fill="none" height="568" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="380" x="51.78" y="42"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="160.2275" x="59.7458" y="54.7803">RunManager.snapshot()</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="199.9512" x="223.863" y="54.7803">&#8212; recomputed on every event</text></g><!--entity L1--><g class="entity" data-qualified-name="Snap.L1" data-source-line="9" id="ent0002"><rect fill="#F4F4F4" height="62" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="211.4336" x="178.07" y="75"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.4336" x="188.07" y="95.7803">1. standard  (source: standard)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="176.6611" x="191.9596" y="109.7803">a = 100 x qty      b = 75 x qty</text><text fill="#000000" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="165.7441" x="188.07" y="123.7803">always present &#8212; the floor</text></g><!--entity L2--><g class="entity" data-qualified-name="Snap.L2" data-source-line="10" id="ent0003"><rect fill="#EAF3FB" height="62" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="219.999" x="173.78" y="197"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.834" x="183.78" y="217.7803">2. fast_path_llm</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="113.6201" x="187.6696" y="231.7803">one LLM call, 20 s</text><text fill="#000000" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="199.999" x="183.78" y="245.7803">overlays 1 where it has an index</text></g><!--entity L3--><g class="entity" data-qualified-name="Snap.L3" data-source-line="11" id="ent0004"><rect fill="#E7F5EC" height="62" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="259.2646" x="154.15" y="364.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.1719" x="164.15" y="385.2803">3. strategy  (router winner)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="235.375" x="168.0396" y="399.2803">strategy2 (prio 2)  &gt;  strategy1 (prio 1)</text><text fill="#000000" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="76.2549" x="164.15" y="413.2803">overlays 1-2</text></g><!--entity L4--><g class="entity" data-qualified-name="Snap.L4" data-source-line="12" id="ent0005"><rect fill="#FDECEC" height="62" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="218.8232" x="174.37" y="532"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.4961" x="184.37" y="552.7803">4. fraud overlay</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.1992" x="188.2596" y="566.7803">if index in fraud_indices:</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="36.9551" x="346.2382" y="566.7803">b := 0</text><text fill="#000000" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="114.4063" x="184.37" y="580.7803">a is never touched</text></g><!--entity Out--><g class="entity" data-qualified-name="Out" data-source-line="19" id="ent0009"><rect fill="#FFF6DA" height="48" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="263.5645" x="7" y="654.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="63.0342" x="17" y="675.2803">Submitted</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5645" x="17" y="689.2803">(index, charge_price, acceptance_limit)</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="23" id="ent0012"><path d="M448.47,319 L448.47,391.5 L413.84,395.5 L448.47,399.5 L448.47,472 A0,0 0 0 0 448.47,472 L737.0999,472 A0,0 0 0 0 737.0999,472 L737.0999,329 L727.0999,319 L448.47,319 A0,0 0 0 0 448.47,319" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M727.0999,319 L727.0999,329 L737.0999,329 L727.0999,319" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="129.3081" x="454.47" y="334.0103">Deterministic pricing</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="91.0381" x="587.3899" y="334.0103">(identical maths</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.8843" x="454.47" y="347.0103">in fast_path.py and strategy1):</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="454.47" y="360.0103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.0762" x="461.6936" y="373.0103">median = (low + high) / 2</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="111.6489" x="461.6936" y="386.0103">fallback = 150 x qty</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="7.2236" x="454.47" y="399.0103">&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="190.3979" x="461.6936" y="399.0103">a = max(fallback, 0.7 x median)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="32.5063" x="673.7625" y="399.0103">(R5b)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="7.2236" x="454.47" y="412.0103">&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="193.229" x="461.6936" y="412.0103">b = Q(1/3) of the spike-and-slab</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="49.1182" x="672.9817" y="412.0103">(R4, R6)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="131.5171" x="476.1409" y="425.0103">clamped to [0, median]</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="454.47" y="438.0103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.5605" x="454.47" y="451.0103">confirmed_uncovered  =&gt;  b = 0, a kept</text><text fill="#000000" font-family="Helvetica" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="192.9307" x="454.47" y="464.0103">an uncovered item is still charged</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="31.7764" x="661.8479" y="464.0103">(R6c)</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="37" id="ent0015"><path d="M305.92,654 L305.92,703 A0,0 0 0 0 305.92,703 L551.6461,703 A0,0 0 0 0 551.6461,703 L551.6461,664 L541.6461,654 L402.56,654 L322.64,594.42 L394.56,654 L305.92,654 A0,0 0 0 0 305.92,654" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M541.6461,654 L541.6461,664 L551.6461,664 L541.6461,654" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="37.5718" x="311.92" y="669.0103">Only a</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="134.3608" x="353.1036" y="669.0103">verbatim policy quote</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="24.5591" x="491.0763" y="669.0103">may</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7261" x="311.92" y="682.0103">produce a fraud verdict &#8212; a suspicious</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7007" x="311.92" y="695.0103">Damage Description may not (Case 7).</text></g><!--link L1 to L2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="14" id="lnk6"><path d="M283.78,137.28 C283.78,155.47 283.78,173.54 283.78,191.73" fill="none" id="L1-to-L2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="283.78,196.73,287.78,187.73,283.78,191.73,279.78,187.73,283.78,196.73" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link L2 to L3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M283.78,259.36 C283.78,289.12 283.78,329.26 283.78,359.06" fill="none" id="L2-to-L3" style="stroke:#181818;stroke-width:1;