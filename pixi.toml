[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = ">=3.11,<3.15"

[target.unix.dependencies]
p7zip = "*"

[target.win-64.dependencies]
7zip = "*"

[tasks]
test = "python -m unittest discover -s tests -v"

# Unzip every Case whose key has been released. Idempotent, and it never fails the caller,
# so it is safe as a prerequisite: going dark costs far more than a stale Case folder.
cases = { cmd = "python scripts/extract_cases.py", env = { PYTHONPATH = "." } }

# Reading the Cases is the first step of the workflow (CLAUDE.md rule 2), so it is the first
# step of the command too. The runner used to extract only into var/cases, which left the
# readable copy in "[PUBLIC] EHL Cases/cases" lagging several Games behind.
start = { cmd = "python main.py", depends-on = ["cases"] }

# The same runner, supervised. Use this one for an unattended stretch -- overnight above all.
# `watch_games()` awaits `run_game()` with no exception boundary, so an uncaught error there
# does not cost a Game, it ends the tournament. `supervise.sh` restarts the process instead,
# which is the cheapest way to buy that back without editing the submission path.
play = { cmd = "bash scripts/supervise.sh", depends-on = ["cases"], env = { PYTHONPATH = "." } }
case-0 = { cmd = "python main.py --game-id 0", depends-on = ["cases"] }

# What a settled Game taught us: joins the decision log against the reconstructed Fair Value
# and names the stage that was wrong, rather than only the amount that was lost.
learn = { cmd = "python scripts/learn_from_game.py", env = { PYTHONPATH = "." } }

# The same thing, unattended. `start` plays the Games; this analyses each one as it settles,
# which cannot happen in the same process because the Transactions that reveal the Fair Value
# only appear a minute or two after a Game ends. Two terminals: one plays, one learns.
watch = { cmd = "python scripts/learn_watch.py", env = { PYTHONPATH = "." } }

# What `watch` spawns automatically for every new lesson: a Claude agent that opens the Case
# and judges the digest against CLAUDE.md's own evidentiary bar. `pixi run review-game 42`
# runs it by hand for one Game, e.g. to reread it after editing the prompt in review_game.py.
review-game = { cmd = "python scripts/review_game.py", env = { PYTHONPATH = "." } }

# Flatten every Line Item we have priced into one table for backtesting: what we believed at
# submission time, what we submitted, what the Game settled at, and what each Strategy would
# have done instead. Nothing in it is estimated -- see the docstring on the Fair Value
# brackets before computing anything conditional on the true `t`.
export = { cmd = "python scripts/export_runs.py", env = { PYTHONPATH = "." } }
# Freeze the finished tournament into `data/tournament/`, verified against the published
# leaderboard to the cent for all seventeen teams. Refuses to write on any disagreement, so
# a green run is itself the proof the archive is faithful. `--offline` re-verifies against
# the archived matrix once the competition endpoints are gone.
archive = { cmd = "python scripts/archive_tournament.py", env = { PYTHONPATH = "." } }

# Which of the four payoff branches the money came out of, over every settled Game. The
# three numbers it exists for -- lawyer waste, fraud let through, forfeited income -- are the
# whole structural surface of the strategy; everything else is arithmetic.
postmortem = { cmd = "python scripts/postmortem.py", env = { PYTHONPATH = "." } }

# What the finished strategy would have scored run from Game 1 -- with all seventeen rows
# recomputed, because our net alone cannot answer a question about placement. `--validate`
# checks the cross terms against the settled rows before reporting anything.
counterfactual = { cmd = "python scripts/experiments/counterfactual_standings.py", env = { PYTHONPATH = "." } }

backtest-sync = { cmd = "python -m backtesting sync", env = { PYTHONPATH = "." } }
backtest-run = { cmd = "python -m backtesting run --spec backtesting/specs/default.json", env = { PYTHONPATH = "." } }
backtest-api = { cmd = "python -m backtesting serve-api", env = { PYTHONPATH = "." } }

[pypi-dependencies]
openai = ">=3.3.1, <4"
python-dotenv = ">=1.2.3, <2"
pypdf = "==6.14.2"
pillow = "==12.3.0"
